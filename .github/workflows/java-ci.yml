name: Java CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE: bhanu4309/javaproject

    steps:
      # ---------------------------
      # Checkout Code
      # ---------------------------
      - name: Checkout Code
        uses: actions/checkout@v3

      # ---------------------------
      # Set up JDK 17
      # ---------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # ---------------------------
      # SonarQube Scan
      # ---------------------------
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_AUTH_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=ansible-jenkinsproject
            -Dsonar.sources=src

      # ---------------------------
      # Maven Build & Deploy to Nexus
      # ---------------------------
      - name: Build & Deploy to Nexus
        run: |
          mvn -s .github/maven/settings.xml clean deploy
        env:
          NEXUS_USR: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PSW: ${{ secrets.NEXUS_PASSWORD }}

      # ---------------------------
      # Login to DockerHub
      # ---------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ---------------------------
      # Build Docker Image
      # ---------------------------
      - name: Build Docker Image
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          docker build -t $DOCKER_IMAGE:$BUILD_NUMBER .
          docker tag $DOCKER_IMAGE:$BUILD_NUMBER $DOCKER_IMAGE:latest

      # ---------------------------
      # Push Docker Image to DockerHub
      # ---------------------------
      - name: Push Docker Image
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          docker push $DOCKER_IMAGE:$BUILD_NUMBER
          docker push $DOCKER_IMAGE:latest

      # ---------------------------
      # Deploy to EC2 (SSH)
      # ---------------------------
      - name: Deploy on EC2 (SSH)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
            docker rm -f javaproject || true
            docker pull bhanu4309/javaproject:latest
            docker run -d --name javaproject -p 8083:8080 bhanu4309/javaproject:latest
