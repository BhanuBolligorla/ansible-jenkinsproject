name: Java CI/CD

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE: bhanu4309/javaproject

    steps:

      # ---------------------------
      # Checkout Code
      # ---------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------
      # Set up JDK 17
      # ---------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # ---------------------------
      # Cache Maven Dependencies
      # ---------------------------
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # ---------------------------
      # Compile + Test + Jacoco
      # ---------------------------
      - name: Maven Build (compile + test + coverage)
        run: mvn clean verify jacoco:report

      # ---------------------------
      # SonarQube Scan
      # ---------------------------
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_AUTH_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=ansible-jenkinsproject \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.java.test.binaries=target/test-classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN

      # ---------------------------
      # Deploy to Nexus Repository
      # ---------------------------
      - name: Build & Deploy to Nexus
        run: mvn -s .github/maven/settings.xml clean deploy
        env:
          NEXUS_USR: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PSW: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_HOST_URL: ${{ secrets.NEXUS_HOST_URL }}

      # ---------------------------
      # DockerHub Login
      # ---------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ---------------------------
      # Build Docker Image
      # ---------------------------
      - name: Build Docker Image
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          docker build -t $DOCKER_IMAGE:$BUILD_NUMBER .
          docker tag $DOCKER_IMAGE:$BUILD_NUMBER $DOCKER_IMAGE:latest

      # ---------------------------
      # Push Docker Image
      # ---------------------------
      - name: Push Docker Image
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          docker push $DOCKER_IMAGE:$BUILD_NUMBER
          docker push $DOCKER_IMAGE:latest
